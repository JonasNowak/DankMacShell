name: Build & Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DankMacShell & Package DMG
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Swift and Xcode Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Run Unit Tests
        run: ./test.sh

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            BASE_VER=$(sed -n 's/.*public static let current = "\([^"]*\)".*/\1/p' Sources/DMSCore/DMSVersion.swift | head -n 1)
            BASE_VER="${BASE_VER:-0.9.9}"
            COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            VER="${BASE_VER}-dev.${COUNT}+${SHORT_SHA}"
          fi
          if [[ "${VER}" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Determined build version: ${VER} (prerelease: ${IS_PRERELEASE})"

      - name: Determine signing mode
        id: signing
        env:
          APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Optional Developer ID signing for releases. When the certificate
          # secrets are set, build/sign/notarize with the Developer ID identity;
          # otherwise keep the exact ad-hoc SIGN_IDENTITY='-' flow.
          if [[ -n "${APPLE_SIGNING_CERT_P12}" && -n "${APPLE_SIGNING_IDENTITY}" ]]; then
            echo "SIGNING_ENABLED=true" >> "$GITHUB_OUTPUT"
            echo "SIGN_IDENTITY=${APPLE_SIGNING_IDENTITY}" >> "$GITHUB_OUTPUT"
            echo "Developer ID signing enabled (identity: ${APPLE_SIGNING_IDENTITY})"
          else
            echo "SIGNING_ENABLED=false" >> "$GITHUB_OUTPUT"
            echo "SIGN_IDENTITY=-" >> "$GITHUB_OUTPUT"
            echo "APPLE_SIGNING_CERT_P12/APPLE_SIGNING_IDENTITY not set; using ad-hoc signing (SIGN_IDENTITY='-')"
          fi

      - name: Import Developer ID certificate into temporary keychain
        if: steps.signing.outputs.SIGNING_ENABLED == 'true'
        env:
          APPLE_SIGNING_CERT_P12: ${{ secrets.APPLE_SIGNING_CERT_P12 }}
          APPLE_SIGNING_CERT_PASSWORD: ${{ secrets.APPLE_SIGNING_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          KEYCHAIN_PATH="$HOME/dms-release-signing.keychain-db"
          P12_PATH="$HOME/dms-release-signing.p12"
          rm -f "$KEYCHAIN_PATH" "$P12_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          printf '%s' "${APPLE_SIGNING_CERT_P12}" | base64 --decode > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "${APPLE_SIGNING_CERT_PASSWORD}" -T /usr/bin/codesign -T /usr/bin/productsign -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$P12_PATH"
          echo "SIGNING_KEYCHAIN=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"

      - name: Build Application & CLI (Release)
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.SIGN_IDENTITY }}
        run: |
          export BUNDLE_SHORT_VERSION="${{ steps.get_version.outputs.VERSION }}"
          ./build.sh --no-launch --release

      - name: Re-sign app & CLIs with hardened runtime and timestamp
        if: steps.signing.outputs.SIGNING_ENABLED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="$HOME/Applications/DankMacShell.app"
          # Re-signing the outer bundle preserves the widget extension's
          # entitlements (codesign reuses nested signatures' entitlements).
          codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --options runtime --timestamp "$APP"
          for bin in "$HOME/.local/bin/dms" "$HOME/.local/bin/dms-symbian"; do
            if [ -f "$bin" ]; then
              codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --options runtime --timestamp "$bin"
            fi
          done
          codesign --verify --verbose=4 "$APP"

      - name: Package DMG Disk Image
        run: |
          ./scripts/create-dmg.sh "${{ steps.get_version.outputs.VERSION }}" "$HOME/Applications/DankMacShell.app"
          cd dist
          shasum -a 256 "DankMacShell-${{ steps.get_version.outputs.VERSION }}.dmg" > checksums.txt
          cat checksums.txt

      - name: Sign DMG with Developer ID
        if: steps.signing.outputs.SIGNING_ENABLED == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          DMG="dist/DankMacShell-${{ steps.get_version.outputs.VERSION }}.dmg"
          codesign --force --sign "${APPLE_SIGNING_IDENTITY}" --options runtime --timestamp "$DMG"
          codesign --verify --verbose=4 "$DMG"

      - name: Notarize DMG with Apple notarytool
        if: steps.signing.outputs.SIGNING_ENABLED == 'true'
        env:
          APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
          APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
          APPLE_NOTARY_TEAM_ID: ${{ secrets.APPLE_NOTARY_TEAM_ID }}
        run: |
          DMG="dist/DankMacShell-${{ steps.get_version.outputs.VERSION }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "${APPLE_NOTARY_APPLE_ID}" \
            --password "${APPLE_NOTARY_PASSWORD}" \
            --team-id "${APPLE_NOTARY_TEAM_ID}" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Refresh DMG checksum after signing
        if: steps.signing.outputs.SIGNING_ENABLED == 'true'
        run: |
          cd dist
          shasum -a 256 "DankMacShell-${{ steps.get_version.outputs.VERSION }}.dmg" > checksums.txt
          cat checksums.txt

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DankMacShell-${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/*.dmg
            dist/checksums.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/checksums.txt
          generate_release_notes: true
          prerelease: ${{ steps.get_version.outputs.IS_PRERELEASE == 'true' }}

      - name: Update Homebrew Cask & Nix Sources on Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.get_version.outputs.IS_PRERELEASE != 'true'
        env:
          VER: ${{ steps.get_version.outputs.VERSION }}
        run: |
          DMG_SHA=$(awk -v dmg="DankMacShell-${VER}.dmg" '$2 == dmg {print $1; exit}' dist/checksums.txt)
          if [ -z "${DMG_SHA}" ]; then
            echo "::error::Could not find sha256 for DankMacShell-${VER}.dmg in dist/checksums.txt"
            exit 1
          fi
          python3 - "$VER" "$DMG_SHA" <<'PY'
          import json, pathlib, re, sys
          ver, sha = sys.argv[1], sys.argv[2]

          cask = pathlib.Path("Casks/dankmacshell.rb")
          if cask.exists():
              txt = cask.read_text()
              txt = re.sub(r'version\s+"[^"]+"', f'version "{ver}"', txt, count=1)
              txt = re.sub(r'sha256\s+"[^"]+"', f'sha256 "{sha}"', txt, count=1)
              cask.write_text(txt)

          sources_path = pathlib.Path("nix/sources.json")
          if sources_path.exists():
              data = json.loads(sources_path.read_text())
              data["dankmacshell"] = {
                  "version": ver,
                  "url": f"https://github.com/JonasNowak/DankMacShell/releases/download/v{ver}/DankMacShell-{ver}.dmg",
                  "sha256": sha,
              }
              sources_path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Casks/dankmacshell.rb nix/sources.json; then
            git add Casks/dankmacshell.rb nix/sources.json
            git commit -m "chore(release): update Homebrew cask and Nix sources for v${VER}"
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin HEAD:main
            else
              echo "::error::origin/main has diverged from this release commit and cannot be fast-forwarded; update Casks/dankmacshell.rb and nix/sources.json on main manually."
              exit 1
            fi
          fi

      - name: Clean up temporary signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" ]]; then
            security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" 2>/dev/null || true
            if [[ -f "${SIGNING_KEYCHAIN}" ]]; then
              security delete-keychain "${SIGNING_KEYCHAIN}" 2>/dev/null || true
              echo "Deleted temporary keychain ${SIGNING_KEYCHAIN}"
            fi
          fi
          rm -f "$HOME/dms-release-signing.p12" 2>/dev/null || true
