name: Build & Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DankMacShell & Package DMG
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Swift and Xcode Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Run Unit Tests
        run: ./test.sh

      - name: Build Application & CLI (Release)
        run: |
          export SIGN_IDENTITY="-"
          ./build.sh --no-launch --release

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            VER="0.5.0-dev.${COUNT}+${SHORT_SHA}"
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "Determined build version: ${VER}"

      - name: Package DMG Disk Image
        run: |
          ./scripts/create-dmg.sh "${{ steps.get_version.outputs.VERSION }}" "$HOME/Applications/DankMacShell.app"
          cd dist
          shasum -a 256 DankMacShell-*.dmg > checksums.txt
          cat checksums.txt

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DankMacShell-${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/*.dmg
            dist/checksums.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/checksums.txt
          generate_release_notes: true
