name: Build & Package

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build DankMacShell & Package DMG
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display Swift and Xcode Environment
        run: |
          swift --version
          xcodebuild -version

      - name: Run Unit Tests
        run: ./test.sh

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            BASE_VER=$(sed -n 's/.*public static let current = "\([^"]*\)".*/\1/p' Sources/DMSCore/DMSVersion.swift | head -n 1)
            BASE_VER="${BASE_VER:-0.9.1}"
            COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            VER="${BASE_VER}-dev.${COUNT}+${SHORT_SHA}"
          fi
          if [[ "${VER}" == *-* ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "VERSION=${VER}" >> "$GITHUB_OUTPUT"
          echo "IS_PRERELEASE=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "Determined build version: ${VER} (prerelease: ${IS_PRERELEASE})"

      - name: Build Application & CLI (Release)
        run: |
          export SIGN_IDENTITY="-"
          export BUNDLE_SHORT_VERSION="${{ steps.get_version.outputs.VERSION }}"
          ./build.sh --no-launch --release

      - name: Package DMG Disk Image
        run: |
          ./scripts/create-dmg.sh "${{ steps.get_version.outputs.VERSION }}" "$HOME/Applications/DankMacShell.app"
          cd dist
          shasum -a 256 "DankMacShell-${{ steps.get_version.outputs.VERSION }}.dmg" > checksums.txt
          cat checksums.txt

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DankMacShell-${{ steps.get_version.outputs.VERSION }}
          path: |
            dist/*.dmg
            dist/checksums.txt
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/checksums.txt
          generate_release_notes: true
          prerelease: ${{ steps.get_version.outputs.IS_PRERELEASE == 'true' }}

      - name: Update Homebrew Cask & Nix Sources on Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.get_version.outputs.IS_PRERELEASE != 'true'
        env:
          VER: ${{ steps.get_version.outputs.VERSION }}
        run: |
          DMG_SHA=$(awk -v dmg="DankMacShell-${VER}.dmg" '$2 == dmg {print $1; exit}' dist/checksums.txt)
          if [ -z "${DMG_SHA}" ]; then
            echo "::error::Could not find sha256 for DankMacShell-${VER}.dmg in dist/checksums.txt"
            exit 1
          fi
          python3 - "$VER" "$DMG_SHA" <<'PY'
          import json, pathlib, re, sys
          ver, sha = sys.argv[1], sys.argv[2]

          cask = pathlib.Path("Casks/dankmacshell.rb")
          if cask.exists():
              txt = cask.read_text()
              txt = re.sub(r'version\s+"[^"]+"', f'version "{ver}"', txt, count=1)
              txt = re.sub(r'sha256\s+"[^"]+"', f'sha256 "{sha}"', txt, count=1)
              cask.write_text(txt)

          sources_path = pathlib.Path("nix/sources.json")
          if sources_path.exists():
              data = json.loads(sources_path.read_text())
              data["dankmacshell"] = {
                  "version": ver,
                  "url": f"https://github.com/JonasNowak/DankMacShell/releases/download/v{ver}/DankMacShell-{ver}.dmg",
                  "sha256": sha,
              }
              sources_path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet Casks/dankmacshell.rb nix/sources.json; then
            git add Casks/dankmacshell.rb nix/sources.json
            git commit -m "chore(release): update Homebrew cask and Nix sources for v${VER}"
            git fetch origin main
            if git merge-base --is-ancestor origin/main HEAD; then
              git push origin HEAD:main
            else
              echo "::error::origin/main has diverged from this release commit and cannot be fast-forwarded; update Casks/dankmacshell.rb and nix/sources.json on main manually."
              exit 1
            fi
          fi
